# YOLO data.yaml for the INSTANCE SEGMENTATION model -- v2 SPLIT.
# Same class taxonomy as data_detect_v2.yaml (same 58 species) — Ultralytics
# tells detect vs segment apart from the --task flag / model checkpoint
# (-seg), not from this yaml.
#
# Dataset: block-stratified split of frame_1000-frame_1771 (772 frames),
# built by restratify_split.py -- NOT a simple time cutoff like the original
# data_seg.yaml. Frames were grouped into contiguous 12-frame blocks, then
# blocks were assigned to train/val so that every class spanning 2+ blocks
# gets at least one block on each side (before this, a single time cutoff
# meant 5 species were val-only -- guaranteed zero recall, model never
# trained on them -- and 20 more were train-only and never evaluated at all).
#   train = 612 frames
#   val   = 160 frames
# Result: 19 of the 34 species that appear anywhere in this window now have
# real train+val coverage (up from 9). 0 species are val-only any more.
# 3 species are still train-only despite spanning 2+ blocks (a limitation of
# the greedy assignment, not of the data). 12 species are confined to a
# single 12-frame block in time and genuinely can't be split either way --
# see restratify_split.py's printed report for the full list.

path: dataset_seg_v2
train: images/train
val: images/val
# test: images/test

