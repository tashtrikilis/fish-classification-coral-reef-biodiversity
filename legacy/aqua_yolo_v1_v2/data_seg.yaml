# YOLO data.yaml for the INSTANCE SEGMENTATION model.
# Same class taxonomy as data_detect.yaml (same 58 species) — Ultralytics
# tells detect vs segment apart from the --task flag / model checkpoint
# (-seg), not from this yaml.
#
# Dataset: temporal split of frame_1000-frame_1771 (772 frames total).
#   train = frame_1000-frame_1617 (618 frames)
#   val   = frame_1618-frame_1771 (154 frames)
# 698 of the 772 frames have the real CVAT polygon label; the other 74 have
# no fish and are included as background frames with an empty label file,
# by your choice.

path: dataset_seg
train: images/train
val: images/val
# test: images/test

